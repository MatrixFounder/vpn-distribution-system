# Стадии по docs/architectures/deployment.md §10.2: lint → unit → contract → build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - uses: actions/setup-go@v6
        # Ключ кэша — по умолчанию go.sum в корне репозитория; модуль лежит в node-agent/ и
        # внешних зависимостей пока не имеет, поэтому ключ берётся с go.mod (иначе на каждом
        # прогоне «Restore cache failed: Dependencies file is not found»).
        with: { go-version: "1.27", cache-dependency-path: node-agent/go.mod }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make tools lint typecheck

  unit:
    runs-on: ubuntu-24.04
    needs: lint
    services:
      postgres:
        # Суперпользователь postgres только для bootstrap ролей (шаг ниже); тесты ходят под
        # app_rw и app_migrate, как на стенде (control-plane/migrations/bootstrap/roles.sql).
        image: postgres:18.6
        env: { POSTGRES_PASSWORD: app, POSTGRES_DB: control_plane }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10
        ports: ["6379:6379"]
    env:
      PG_DSN: postgresql://app_rw:app@127.0.0.1:5432/control_plane
      MIGRATE_DSN: postgresql://app_migrate:app@127.0.0.1:5432/control_plane
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - uses: actions/setup-go@v6
        # Ключ кэша — по умолчанию go.sum в корне репозитория; модуль лежит в node-agent/ и
        # внешних зависимостей пока не имеет, поэтому ключ берётся с go.mod (иначе на каждом
        # прогоне «Restore cache failed: Dependencies file is not found»).
        with: { go-version: "1.27", cache-dependency-path: node-agent/go.mod }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Роли базы (bootstrap, как initdb.d на стенде)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -U postgres -d control_plane -v ON_ERROR_STOP=1 \
            -v db=control_plane -v rw=app -v mig=app -v bk=app -f - \
            < control-plane/migrations/bootstrap/roles.sql
      - run: make setup
      # Схема — предусловие набора; на стенде её создаёт роль api при старте, здесь база пустая.
      # Без этого шага сквозные тесты падают на `ensure_partitions(integer) does not exist`.
      - run: make migrate
      - run: make tools test

  contract:
    # Контрактные тесты /agent/v1 (001.28); эталонные ответы подписки добавит 001.43.
    # Служебные контейнеры не нужны: прогон герметичен, пул подменён объектом-часовым.
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - uses: actions/setup-go@v6
        with: { go-version: "1.27", cache-dependency-path: node-agent/go.mod }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make setup
      - run: make test-contract

  build:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        # Ключ кэша — по умолчанию go.sum в корне репозитория; модуль лежит в node-agent/ и
        # внешних зависимостей пока не имеет, поэтому ключ берётся с go.mod (иначе на каждом
        # прогоне «Restore cache failed: Dependencies file is not found»).
        with: { go-version: "1.27", cache-dependency-path: node-agent/go.mod }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: node-agent (статический бинарный файл + контрольная сумма)
        run: |
          cd node-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X node-agent/internal/app.Version=${GITHUB_SHA::12}" -o ../dist/node-agent ./cmd/node-agent
          cd ../dist && sha256sum node-agent > node-agent.sha256
      - name: web (проверка типов; сборка статических файлов появляется с Vite в 001.62)
        run: cd web && npm ci --no-audit --no-fund && npm run -s typecheck
      - name: control-plane (образ Docker появляется в 001.02)
        run: |
          if [ -f control-plane/Dockerfile ]; then docker build -t control-plane:ci control-plane; else echo "Dockerfile появится в 001.02"; fi
      # v4 работает на Node 20 (объявлен устаревшим на раннерах); v7 — текущий мажор.
      - uses: actions/upload-artifact@v7
        with: { name: node-agent, path: dist/ }

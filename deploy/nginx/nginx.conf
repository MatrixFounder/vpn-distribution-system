# nginx стенда Control Plane — компонент C-09 (docs/architectures/system-architecture.md §3.2).
#
# Три server:
#   1. публичный (80, 443) — кабинет, панель, домены подписки, /healthz; /agent/ закрыт;
#   2. агентский (8443) — /agent/v1 только с клиентским сертификатом внутреннего CA (mTLS),
#      отпечаток передаётся в C-01 заголовком X-Client-Fingerprint;
#   3. enrollment (8444) — только /agent/v1/enroll, без клиентского сертификата (§7.1).
# Правила границы C-09: (1) X-Client-Fingerprint задаёт только прокси; (2) api не публикуется
# наружу — достижим лишь из сети Compose; (3) на агентском server ssl_verify_client on;
# (4) стоимость запроса до проверки identity ограничивает прокси: тела без известной длины на
# агентском и enrollment-server не принимаются (411 — временных файлов тел и усиления
# обрамлением нет по конструкции), пределы тела по классам операций с буферами, равными
# пределам, одновременность и частота по отпечатку сертификата на каждой операции агентского
# server, общие потолки на парк (одновременные отчёты и частота остальных операций — зоны с
# постоянным ключом "agent"), у enrollment-server — пределы по адресу источника и общий потолок
# частоты (хеш токена — 001.72); ответы апстрима сверх буферов — во временный файл на tmpfs не
# больше 8 МиБ на ответ; 411, 429 и 503 прокси — в едином формате с Retry-After у 429 и 503
# (system-architecture.md §3.2, 001.33).
# Путь /s/ не попадает в журнал доступа (Н-25). Домены, ACME, HSTS, CSP — задача 001.66.
#
# Сертификаты монтируются в /etc/nginx/certs (deploy/compose/secrets/tls/, см. secrets/README.md):
#   public.crt/.key — публичные домены; agent.crt/.key — порты 8443 и 8444; ca.crt — CA агентов.
#   Клиентские сертификаты для проверки (dev-node) лежат отдельно, в nginx не монтируются.

# Один рабочий процесс: контейнеру выдана одна доля процессора (cpus 1.0 в Compose), а auto взял
# бы число ядер хоста — несколько worker'ов на одной квоте троттлятся вместе и раздувают urt,
# которым меряется Н-4; замеры стенда сняты с одним worker'ом. Страж сверяет с Compose.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    # 1024 на worker: при §5.7 (50 нод × 8 соединений агентского server и столько же к апстриму
    # — keepalive к нему нет) занято до ~800; парк вдвое больше упрётся сюда раньше, чем в зоны:
    # пересчёт при росте парка и пределы публичного server — 001.66/001.72.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    # Временные файлы прокси — тела запросов и ответы апстрима, не поместившиеся в буферы. Весь
    # каталог /var/cache/nginx смонтирован в Compose как tmpfs с пределом: память контейнера под
    # его потолком (swap выключен), не диск хоста (страж сверяет оба пути с точкой монтирования).
    # На агентском и enrollment-server тел без известной длины не бывает (411, см.
    # $body_without_length), а буферы равны пределам — временных файлов тел там нет по
    # конструкции; тела пишет только публичный server (буфер 16k по умолчанию, тело до 1 МиБ;
    # пределы — 001.66). Ответы апстрима (снапшот состава с credentials, страница подписки,
    # панель) сверх proxy_buffers уходят в тот же tmpfs — не больше proxy_max_temp_file_size на
    # ответ, и nginx отпускает апстрим сразу: запрет временных файлов ответов (раунд 7) держал бы
    # апстрим на скорости клиента и втащил бы её в $upstream_response_time — снят решением
    # заказчика (раунд 8). tmpfs один на тела публичного server и ответы всех трёх server:
    # анонимные медленные заливки на публичный server могут его заполнить, и тогда ответ Node
    # API сверх буферов (снапшот состава) получит 500 — разделение каталогов и размер под парк
    # (число нод × потолок снапшота) — 001.66/001.75 (роаст раунда 8). Размер в Compose —
    # восемь ответов предела (agent_conn 8 одного сертификата), не потолок парка.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    proxy_max_temp_file_size 8m;
    # Тело запроса читается целиком до передачи апстриму, ответ апстрима читается целиком без
    # оглядки на клиента — оба умолчания nginx объявлены явно: на них стоит трактовка Н-4 по
    # времени апстрима (ни заливка при полосе ноды, ни отдача ответа клиенту в
    # $upstream_response_time не входят); страж не даёт переопределить их ни в одном блоке.
    proxy_request_buffering on;
    proxy_buffering on;
    # Соединение с апстримом и отправка ему запроса — внутри сети Compose: секунды, не минуты
    # по умолчанию, иначе зависший api держит слот отчётов парка. Чтение ответа — на server.
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    # Заголовки запроса — не дольше 5 с (умолчание 60 с): limit_conn считает запросы в полёте,
    # а соединение, присылающее по байту заголовка, до запроса не доходит и слотов зон не
    # занимает — только слот worker_connections, общий у всех трёх server; таймаут делает
    # такое удержание ценой полного рукопожатия на попытку (роаст раунда 8); запас
    # worker_connections от анонимной части — 001.66/001.72.
    client_header_timeout 5s;
    reset_timedout_connection on;
    # Тело без известной длины (Transfer-Encoding у HTTP/1.1, поток HTTP/2 без content-length)
    # контракт Node API не обещает (README: Content-Length обязателен), а нужно оно только
    # враждебному клиенту: без него нет ни сырого потока с обрамлением без верхней границы, ни
    # временных файлов тел, ни усиления в тысячи раз. Агентский и enrollment-server отвечают на
    # такое 411 в едином формате (@length_required). Transfer-Encoding — при любом методе (в
    # раунде 7 правило знало только POST/PUT/PATCH, и DELETE с chunked читался до 405 —
    # поймано линзой и стендом); отсутствие длины — у любого метода, кроме GET и HEAD (у них
    # тела нет по контракту, GET long-poll без тела под правило не попадает): по HTTP/2
    # заголовка Transfer-Encoding нет, и DELETE или OPTIONS без content-length иначе читался
    # бы до 405, занимая слот отчётов (роаст раунда 8). Страж подаёт на эти правила таблицу
    # троек; регулярные правила map видят исходную строку, точные ключи сравниваются без
    # учёта регистра.
    map "$request_method:$content_length:$http_transfer_encoding" $body_without_length {
        default 0;
        "~^[^:]+:[^:]*:.+$" 1;
        "~*^(?!get:|head:)[^:]+::$" 1;
    }

    # Н-25: токен подписки находится в пути. Первый ключ — нормализованный $uri: формы //s/,
    # /%73/, /x/../s/ маршрутизируются в location /s/ и обязаны фильтроваться так же. Второй —
    # сырая строка запроса $request (она и пишется в журнал): /s/, /%73/ или /%53/ в любом месте
    # пути запроса до «?», без привязки к методу и к началу пути — метод с дефисом, второй
    # пробел, absolute-form и сырые //s/ обходили якорь «^[A-Z]+ /s/» (раунд 7, поймано
    # линзами и стендом); строка запроса в правило не входит — иначе любой клиент прятал бы
    # себя из журнала суффиксом «?/s/» (роаст раунда 8). Регистр не учитывается (~*). Третий
    # ключ — запрос, отвергнутый до разбора URI
    # (400 с пустым $uri: негодный процент, оборванная строка запроса): его строка пишется
    # форматом без $request вовсе — токен в такой строке разбору не поддаётся, а журналу он не
    # нужен. Четвёртая линия — access_log off в самом location /s/. Страж подаёт на правила
    # таблицу сырых строк.
    map $uri $loggable_uri {
        default 1;
        ~*^/s/  0;
    }
    map $request $loggable_raw {
        default 1;
        "~*^\S+\s+[^?\s]*/(?:s|%73|%53)/" 0;
    }
    map "$status:$uri" $unparsed {
        default 0;
        "~^400:$" 1;
    }
    map "$loggable_uri$loggable_raw$unparsed" $loggable {
        default 0;
        "110"   1;
    }

    # Referer со страницы подписки содержит токен — в access.log заменяется на «-». Ответы /s/
    # несут Referrer-Policy: no-referrer, поэтому браузер такой Referer не отправляет вовсе;
    # остаток — клиент, сам подставивший свой токен в Referer запроса с ошибкой апстрима:
    # error.log дописывает referrer к сообщению об ошибке, его формат не настраивается.
    map $http_referer $log_referer {
        ""      "-";
        ~/s/    "-";
        default $http_referer;
    }

    # rt/urt — время запроса целиком и время ответа апстрима: без них норматив Н-4 (p95 Node
    # API) не измерить на стенде, а стоимость заливки тела не отделить от стоимости разбора.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$log_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    # Запрос, отвергнутый до разбора URI, — без строки запроса (Н-25, см. $unparsed).
    log_format unparsed '$remote_addr - - [$time_local] "<unparsed>" '
                        '$status $body_bytes_sent "-" "$http_user_agent" '
                        'rt=$request_time urt=-';
    access_log /var/log/nginx/access.log main if=$loggable;
    access_log /var/log/nginx/access.log unparsed if=$unparsed;

    # Адрес api резолвится DNS Docker при обращении (переменная $api в proxy_pass): nginx
    # стартует и отвечает 502, когда api ещё не поднят, вместо отказа запуска.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Установка соединения с апстримом входит в $upstream_response_time (keepalive невозможен с
    # переменной в proxy_pass): заикание DNS не должно стоить 30 с по умолчанию.
    resolver_timeout 5s;
    # Отказы и задержки пределов — в access.log статусом 429 и временем; в error.log при уровне
    # warn их не пишем: штатное троттлирование парка иначе вымывало бы журнал (10 МиБ × 3).
    limit_req_log_level notice;
    limit_conn_log_level notice;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    proxy_http_version 1.1;

    # Пределы одновременности и частоты для нод (правило границы 4; §11.3: держатель
    # сертификата — недоверенная сторона, а тело запроса C-01 читает и разбирает JSON до проверки
    # identity; отозванную identity nginx не знает до 001.25). Ключ — отпечаток клиентского
    # сертификата (не identity ноды: в окне ротации Н-28 у ноды два сертификата и два бюджета);
    # на агентском server mTLS обязателен, отпечаток есть у каждого запроса. Зоны с постоянным
    # ключом "agent" — общие потолки на весь парк, одно ведро ($server_name не годится: у всех
    # трёх server он `_`, и та же зона на другом server делила бы ведро с парком):
    # agent_report_total — одновременные отчёты (процессорное время и память C-01: две части
    # потолка по стоимости элемента в бюджете Н-4 — гейт tests/unit/test_proxy_contract.py; ~3,7
    # МиБ памяти на часть), agent_fleet_rate — частота остальных операций.
    # Соединение занимает слот с фазы preaccess до конца ответа, в том числе во время заливки
    # тела (пауза между чтениями — до client_body_timeout; при известной длине тело не больше
    # предела, а держать слот ровным потоком нечем — тела без длины не принимаются) — два
    # сертификата с медленными заливками занимают все слоты отчётов парка: остаточный риск до
    # ssl_crl (001.25) и лимитов приложения (001.72), записан в 001.33 и в таблице угроз
    # security.md §7.3. Запрос, ждущий в очереди limit_req, слота limit_conn не держит:
    # limit_req проверяется раньше limit_conn (проверено на стенде — восемь отчётов подряд одним
    # сертификатом проходят по очереди, а не 429). Частота остальных операций (heartbeat раз в
    # 30 с, состояние, телеметрия, подтверждения) — пять запросов в секунду с очередью 20 на
    # сертификат и пятнадцать в секунду с очередью 200 на весь парк (rate зоны agent_fleet_rate):
    # самый дорогой путь отказа такой операции — 64-КиБ тело из минимально коротких лишних
    # ключей (≈8 500 ключей) — после проверки формы по байтам в приложении стоит 2 мс цикла
    # (результат команды с бюджетом свободного текста — 4 мс: самая дорогая из остальных)
    # событий по p95 стенда (константа H4_OTHER_OPERATION_MS гейта
    # tests/unit/test_proxy_contract.py; там же: частота парка × стоимость плюс то же у
    # enrollment ≤ четверти одного цикла, операции обеих зон, прибывающие за окно разбора двух
    # частей отчёта, входят в бюджет отчёта слагаемыми; цикл на потолке одновременности 2 может
    # быть занят отчётами целиком — это назначение потолка, задержку держит окно разбора).
    # Штатно парк §5.7 даёт ~5 запросов в секунду (Н-4: 0,5 при
    # О-3); очередь 200 вмещает парк, вернувшийся после недоступности Control Plane (50 нод × 4
    # запроса) — без nodelay: лишние ждут в прокси, а не бьют залпом в цикл событий (очередь
    # выдаёт запросы равномерно, цикл обслуживает их в порядке поступления — на этих двух
    # посылках держится модель гейта; агент держит таймаут остальных операций ≥ 30 с — очередь
    # 200 при пятнадцати в секунду это 14 с, — а long-poll состояния ≥ 60 с — очередь плюс
    # удержание, README). Два сертификата (одна нода в окне ротации: 2 × 5 = 10 из 15) берут
    # две трети частоты парка, три — всю; остальные ждут в очереди и получают 429:
    # записано в security.md §7.3, лечение — отзыв (001.25) и пределы приложения (001.72).
    # Предел соединений на парк для этих операций не ставится: long-poll состояния (001.75)
    # держит по соединению на ноду. Enrollment-server (без сертификата) — пределы по адресу
    # источника (enroll_conn_addr, enroll_addr_rate: один адрес не выбирает enrollment всему
    # парку — с общим ведром восемь медленных заливок делали это анонимно) и общий потолок
    # частоты enroll_fleet_rate (защита цикла событий: enrollment — редкая ручная операция);
    # хеш токена и ботнет с многих адресов — 001.72.
    # Размер зон: 1m хранит ~16 000 ключей, парк по О-3 — десятки нод, §5.7 — до 50; меньше 1m
    # nginx не советует, а при исчерпании зоны 429 получали бы все.
    limit_conn_zone $ssl_client_fingerprint zone=agent_conn:1m;
    limit_conn_zone $ssl_client_fingerprint zone=agent_report_conn:1m;
    limit_conn_zone "agent" zone=agent_report_total:1m;
    limit_conn_zone $binary_remote_addr zone=enroll_conn_addr:1m;
    limit_req_zone $ssl_client_fingerprint zone=agent_report_rate:1m rate=2r/s;
    limit_req_zone $ssl_client_fingerprint zone=agent_rate:1m rate=5r/s;
    limit_req_zone "agent" zone=agent_fleet_rate:1m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=enroll_addr_rate:1m rate=1r/s;
    limit_req_zone "enroll" zone=enroll_fleet_rate:1m rate=2r/s;

    # proxy_set_header не наследуется уровнем server, задающим хотя бы один свой заголовок,
    # поэтому полный набор повторяется в каждом server.

    # Проверка живости самого nginx для healthcheck Compose — только локальный адрес контейнера.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /-/health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    # 1. Публичный server.
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/public.crt;
        ssl_certificate_key /etc/nginx/certs/public.key;

        set $api http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For перезаписывается адресом соединения, а не дополняется
        # ($proxy_add_x_forwarded_for): nginx — единственный и первый прокси, значение от клиента
        # отбрасывается, и uvicorn (--proxy-headers, docker-entrypoint.sh) видит ровно один адрес.
        # Дополнение позволило бы клиенту подставить свой адрес крайним левым элементом.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Правило границы 1: пустое значение удаляет заголовок, пришедший от клиента.
        proxy_set_header X-Client-Fingerprint "";
        client_max_body_size 1m;

        # Node API доступен только через агентский server (и /agent без слэша тоже).
        location = /agent {
            return 404;
        }

        # Метрики (§5.4) снимает C-10 внутри сети Compose с api:8000; наружу не публикуются.
        location = /metrics {
            return 404;
        }

        location ^~ /agent/ {
            return 404;
        }

        # Н-25: токен в пути. access_log off — вторая линия к map $loggable; error.log при ошибке
        # апстрима пишет request-строку — порог crit, ошибки апстрима здесь не журналируются;
        # Referrer-Policy — браузер не отдаст адрес страницы подписки соседним запросам.
        location ^~ /s/ {
            access_log off;
            error_log /var/log/nginx/error.log crit;
            add_header Referrer-Policy "no-referrer" always;
            proxy_pass $api;
        }

        location / {
            proxy_pass $api;
        }
    }

    # 2. Агентский server: mTLS обязателен (правило границы 3 — on, не optional).
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate        /etc/nginx/certs/agent.crt;
        ssl_certificate_key    /etc/nginx/certs/agent.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client      on;
        # 1 — только сертификаты, подписанные ca.crt напрямую (внутренний CA без промежуточных,
        # 001.24/001.25): глубина 2 позволила бы ноде с листовым сертификатом без CA:FALSE
        # подписывать себе «сиблингов» и множить отпечатки — ключи всех зон по сертификату.
        ssl_verify_depth       1;

        set $api http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;
        # Long-poll состояния удерживается C-01 до 30 с (interfaces.md §5.2) — запас сверху;
        # location отчётов ставит свой короткий предел (зависший api не должен держать слот парка).
        proxy_read_timeout 90s;
        # Одна нода держит long-poll состояния и параллельно шлёт heartbeat, телеметрию, отчёт и
        # результат команды — восемь соединений с запасом; сверх — 429. limit_conn не
        # наследуется location, объявившим свой limit_conn, поэтому в location отчётов предел
        # повторён. Частота остальных операций — по сертификату и на весь парк — на уровне
        # server: её наследуют все location без своего limit_req, в том числе пути отказа
        # (411, 404, @rate_limited), а location отчётов объявляет свою зону и потому не
        # наследует. 429 отдаётся в едином формате ошибки с Retry-After (location @rate_limited):
        # так требует §5.2 и так его разбирает агент.
        limit_conn agent_conn 8;
        limit_req zone=agent_rate burst=20;
        limit_req zone=agent_fleet_rate burst=200;
        limit_conn_status 429;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        # Апстрим не отвечает (api перезапускается, исчерпан пул, истёк таймаут): единый формат
        # с Retry-After, а не страница nginx — код, о котором агент узнал бы только в бою.
        error_page 502 503 504 = @upstream_unavailable;
        # 404 — через именованный location: `return` в location исполняется в фазе REWRITE,
        # раньше PREACCESS, где живут limit_req и limit_conn, и залп на несуществующий путь
        # без редиректа не знал бы пределов (роаст раунда 8); error_page ведёт во внутренний
        # редирект, который проходит PREACCESS заново.
        error_page 404 = @not_found;
        # Тело без известной длины не принимается (map $body_without_length): 411 в едином
        # формате — Content-Length обязателен по контракту.
        if ($body_without_length) {
            return 411;
        }
        error_page 411 = @length_required;
        # Пауза между чтениями тела — не дольше 10 с на всех операциях server (предела на всю
        # заливку у nginx нет: медленная заливка держит слот — остаточный риск, см. зоны выше).
        client_body_timeout 10s;
        # Тела операций раздела — сотни байт (heartbeat, телеметрия, подтверждение, результат
        # команды, запрос гранта): 64 КиБ с запасом. Тело читается до разрешения зависимостей, то
        # есть до отказа по версии агента или identity, — предел здесь и есть защита от оплаты
        # чужого мусора. Отчёты о трафике со строками по пользователям (§5.2) весят больше: их
        # предел стоит в собственном `location = /agent/v1/reports` (001.33), а не на весь server.
        # Буфер равен пределу: при известной длине тело до предела лежит в памяти целиком, и во
        # временный файл nginx его не пишет (с буфером 16k по умолчанию 60-КиБ heartbeat туда
        # попадал — наблюдалось на стенде); тела без длины отвергнуты выше.
        client_max_body_size 64k;
        client_body_buffer_size 64k;

        # Enrollment обслуживает только server 3.
        location = /agent/v1/enroll {
            return 404;
        }

        # Отчёт о трафике (§5.9) — единственная операция раздела с телом больше сотен байт:
        # до 500 строк по пользователям и 2 500 адресов в одной части (пределы модели —
        # control-plane/app/accounting/service.py, выведены из бюджета Н-4 при двух
        # одновременных частях на парк по стоимости элемента с p95 стенда; парк больше — частей
        # за интервал больше, пропускная способность парка — 2 / (заливка + разбор) частей в
        # секунду, см. README каталога контрактов и 001.73).
        # Самое большое допустимое тело — 0,44 МиБ в записи json.dumps с пробелами (0,42 МиБ
        # компактно); предел этого location вмещает его с полосой не шире 1 МиБ — в полосе лежат
        # тела, которые приложение читает: шире самого большого допустимого по числу скобок и
        # запятых — отказ по байтам до разбора, остальное (пробелы, лишние ключи в пределах
        # счётчиков) разбирается и отвергается по пределу модели (страж —
        # tests/unit/test_proxy_contract.py). В байтах предел не ограничивает число элементов:
        # 1 МиБ вложенных пустых массивов — 350 000 элементов и 22 МиБ памяти в json.loads
        # (измерено; отсекается проверкой формы), поэтому бюджет памяти считается по худшей
        # записи, а не по канонической. Остальные операции раздела остаются под пределом server:
        # тело читается до отказа по версии и identity.
        location = /agent/v1/reports {
            client_max_body_size 1m;
            # Буфер равен пределу: тело отчёта (адреса пользователей, §16) с известной длиной
            # лежит в памяти прокси целиком, временного файла нет; заливка без длины — с сырым
            # потоком и обрамлением без верхней границы (расширения чанков, ведущие нули —
            # в раунде 6 такая заливка шла в tmpfs) — на этом server не принимается (411).
            # Буфер выделяется только соединению с телом — не больше двух отчётов одновременно.
            client_body_buffer_size 1m;
            # Не больше одного отчёта от ноды (части идут последовательно) и двух от всего парка
            # одновременно; частота — отчёт раз в 60 с (§5.9), слив буфера Н-8 — не быстрее
            # двух в секунду, очередь до десяти (без nodelay: лишние ждут, а не получают отказ).
            # Предел соединений ноды повторён: location со своим limit_conn не наследует server.
            limit_conn agent_conn 8;
            limit_conn agent_report_conn 1;
            limit_conn agent_report_total 2;
            limit_req zone=agent_report_rate burst=10;
            # Ответ на часть — две строки JSON: зависший api не держит слот парка 90 с.
            proxy_read_timeout 10s;
            proxy_pass $api;
        }

        # 429 от пределов прокси — в едином формате ошибки §5.1 и с Retry-After (§5.2: отказы
        # несут Retry-After): агент ждёт секунду и повторяет тот же запрос.
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"rate_limited","message":"превышен предел прокси","details":{}}}';
        }

        # 411 — тело без известной длины (Content-Length обязателен): агент чинит клиент, не
        # повторяет.
        location @length_required {
            default_type application/json;
            return 411 '{"error":{"code":"length_required","message":"тело без известной длины не принимается","details":{}}}';
        }

        # Апстрим недоступен: агент ждёт и повторяет тот же запрос.
        location @upstream_unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"error":{"code":"upstream_unavailable","message":"сервис временно недоступен","details":{}}}';
        }

        # Нет такого пути — единый формат, без Retry-After; пределы server действуют (см.
        # error_page 404 выше).
        location @not_found {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"нет такого пути","details":{}}}';
        }

        # Остальные операции раздела: предел частоты по сертификату и на весь парк наследуется
        # от server, как и предел соединений agent_conn — своих пределов здесь нет.
        location ^~ /agent/v1/ {
            proxy_pass $api;
        }

        # Нет такого пути: не `return 404` — он исполняется в фазе REWRITE до пределов, и залп
        # на несуществующий путь их не знал бы (стенд: 30 параллельных 404 без единого 429
        # даже через error_page — внутренний редирект идёт после решения, которого не было);
        # try_files решает в фазе PRECONTENT, после limit_req/limit_conn, и заведомо
        # отсутствующий файл ведёт в error_page 404 = @not_found.
        location / {
            try_files /nonexistent =404;
        }
    }

    # 3. Enrollment server: одноразовый bootstrap-токен, клиентского сертификата ещё нет (§7.1).
    # Единственный анонимный вход Node API: пределы соединений и частоты — по адресу источника
    # (один адрес не выбирает enrollment всему парку), общий потолок частоты на всех — защита
    # цикла событий (хеш токена — 001.72); тела без известной длины — 411, буфер равен пределу
    # тела, как у агентского server; 411 и 429 — в том же едином формате.
    server {
        listen 8444 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/agent.crt;
        ssl_certificate_key /etc/nginx/certs/agent.key;

        set $api http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Fingerprint "";
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_timeout 10s;
        # Пределы по адресу и потолок парка — на уровне server: их наследуют и пути отказа (411,
        # 404, @rate_limited) — анонимный клиент не вымывает журнал без единого 429.
        limit_conn enroll_conn_addr 4;
        limit_req zone=enroll_addr_rate burst=5;
        limit_req zone=enroll_fleet_rate burst=10;
        limit_conn_status 429;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @upstream_unavailable;
        # 404 — через именованный location: `return` в location исполняется в фазе REWRITE,
        # раньше PREACCESS, где живут limit_req и limit_conn, и залп на несуществующий путь
        # без редиректа не знал бы пределов (роаст раунда 8); error_page ведёт во внутренний
        # редирект, который проходит PREACCESS заново.
        error_page 404 = @not_found;
        if ($body_without_length) {
            return 411;
        }
        error_page 411 = @length_required;

        location = /agent/v1/enroll {
            proxy_pass $api;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"rate_limited","message":"превышен предел прокси","details":{}}}';
        }

        location @length_required {
            default_type application/json;
            return 411 '{"error":{"code":"length_required","message":"тело без известной длины не принимается","details":{}}}';
        }

        location @upstream_unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"error":{"code":"upstream_unavailable","message":"сервис временно недоступен","details":{}}}';
        }

        # Нет такого пути — единый формат, без Retry-After; пределы server действуют (см.
        # error_page 404 выше).
        location @not_found {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"нет такого пути","details":{}}}';
        }

        # Нет такого пути: не `return 404` — он исполняется в фазе REWRITE до пределов, и залп
        # на несуществующий путь их не знал бы (стенд: 30 параллельных 404 без единого 429
        # даже через error_page — внутренний редирект идёт после решения, которого не было);
        # try_files решает в фазе PRECONTENT, после limit_req/limit_conn, и заведомо
        # отсутствующий файл ведёт в error_page 404 = @not_found.
        location / {
            try_files /nonexistent =404;
        }
    }
}

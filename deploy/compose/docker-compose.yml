# Compose стенда Control Plane — окружение «Стенд» из docs/architectures/deployment.md §10.1:
# PostgreSQL 18 (архив WAL включён), Redis 8 (appendonly), nginx 1.30 и четыре роли одного
# приложения (C-01 api, C-02 worker-critical / worker-background, C-03 scheduler).
#
# Разработка: этот файл + docker-compose.dev.yml (порты наружу, монтирование исходников).
# Промышленный профиль (restart, ACME, без публикации портов C-01) — задача 001.66;
# pgbackrest и архив WAL в S3 — задача 001.67; Prometheus/Alertmanager — задача 001.68.
#
# Переменные — deploy/compose/.env (образец: .env.example). Секреты — файлы в
# deploy/compose/secrets/ (перечень: secrets/README.md); в репозиторий не попадают.
#
# Запуск из корня репозитория:
#   docker compose --env-file deploy/compose/.env \
#     -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.dev.yml up -d --build

name: control-plane

# Общее окружение ролей: адреса внутри сети Compose; пароли и ключи — только файлами секретов
# (§10.3). Роль процесса задаёт APP_ROLE (control-plane/docker-entrypoint.sh).
# Роли базы (data-model.md §4.6): приложение ходит под app_rw, миграции — под app_migrate,
# app_owner — владелец объектов без входа. Роли создаёт postgres/initdb.d/10-roles.sh при
# инициализации кластера (пароли из pg_app_*_password); суперпользователь образа `postgres`
# (секрет pg_password) приложением не используется.
x-app-env: &app-env
  PG_DSN: postgresql://app_rw@postgres:5432/control_plane
  PG_PASSWORD_FILE: /run/secrets/pg_app_rw_password
  REDIS_URL: redis://redis:6379/0
  APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key

# Секреты ролей монтируются в /run/host-secrets: файлы хоста с правами оператора недоступны
# uid 10001, поэтому docker-entrypoint.sh (от root) копирует их в /run/secrets владельцу app
# и сбрасывает привилегии. Переменные *_FILE указывают на /run/secrets.
x-app: &app
  build:
    context: ../../control-plane
    dockerfile: Dockerfile
  image: control-plane/app:dev
  env_file:
    - path: .env
      required: false
  secrets:
    - source: pg_app_rw_password
      target: /run/host-secrets/pg_app_rw_password
    - source: app_encryption_key
      target: /run/host-secrets/app_encryption_key
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6
    # Обёртка точки входа: секреты паролей ролей → /run/pg-secrets для пользователя postgres
    # (скрипты initdb.d выполняются не от root), затем штатный docker-entrypoint.sh образа.
    entrypoint: ["/bin/bash", "/opt/control-plane/entrypoint.sh"]
    # archive_mode = on с локальным архивом на томе (Н-9, §9.2): сегменты копируются в
    # /var/lib/postgresql/wal_archive. Рост ограничен: сегменты старше 3 суток удаляются той же
    # командой (при активности archive_timeout=900 даёт до ~96 сегментов × 16 МиБ в сутки).
    # Это архив стенда; 001.67 заменяет команду на pgbackrest archive-push с хранением в S3.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=${PG_ARCHIVE_COMMAND:-mkdir -p /var/lib/postgresql/wal_archive && test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f && find /var/lib/postgresql/wal_archive -type f -mtime +3 -delete}
    environment:
      # Суперпользователь образа — `postgres` (умолчание). Роли приложения создаёт
      # postgres/initdb.d/10-roles.sh при инициализации кластера (только на пустом томе).
      POSTGRES_DB: control_plane
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
      - pg_app_rw_password
      - pg_app_migrate_password
      - pg_app_backup_password
    volumes:
      # Образ postgres:18 хранит данные в /var/lib/postgresql/18/docker — том монтируется на
      # родительский каталог, иначе данные остаются в контейнере.
      - pg_data:/var/lib/postgresql
      - ./postgres/entrypoint.sh:/opt/control-plane/entrypoint.sh:ro
      - ./postgres/initdb.d/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ../../control-plane/migrations/bootstrap/roles.sql:/opt/control-plane/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_plane"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10
    # appendonly — §4.20: сессии и счётчики переживают перезапуск; noeviction — сессия не
    # исчезает молча при нехватке памяти (fail-closed, §9.1).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx:
    image: nginx:1.30
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDR:-0.0.0.0}:${AGENT_PORT:-8443}:8443"
      - "${BIND_ADDR:-0.0.0.0}:${ENROLL_PORT:-8444}:8444"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Только серверные сертификаты и CA; клиентские dev-сертификаты лежат в secrets/dev/.
      - ./secrets/tls:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # Собственная проверка nginx на локальном порту 8081, независимая от api.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/-/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *app
    environment:
      <<: *app-env
      # Миграции при старте (001.03, §10.2) — отдельное подключение под app_migrate.
      MIGRATE_DSN: postgresql://app_migrate@postgres:5432/control_plane
      MIGRATE_PASSWORD_FILE: /run/secrets/pg_app_migrate_password
      CA_KEY_FILE: /run/secrets/ca_key
      APP_ROLE: api
    secrets:
      - source: pg_app_rw_password
        target: /run/host-secrets/pg_app_rw_password
      - source: pg_app_migrate_password
        target: /run/host-secrets/pg_app_migrate_password
      - source: app_encryption_key
        target: /run/host-secrets/app_encryption_key
      - source: ca_key
        target: /run/host-secrets/ca_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker-critical:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker-critical

  worker-background:
    <<: *app
    environment:
      <<: *app-env
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      APP_ROLE: worker-background
    secrets:
      - source: pg_app_rw_password
        target: /run/host-secrets/pg_app_rw_password
      - source: app_encryption_key
        target: /run/host-secrets/app_encryption_key
      - source: smtp_password
        target: /run/host-secrets/smtp_password

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: scheduler

secrets:
  pg_password:
    file: ./secrets/pg_password
  pg_app_rw_password:
    file: ./secrets/pg_app_rw_password
  pg_app_migrate_password:
    file: ./secrets/pg_app_migrate_password
  pg_app_backup_password:
    file: ./secrets/pg_app_backup_password
  app_encryption_key:
    file: ./secrets/app_encryption_key
  ca_key:
    file: ./secrets/ca_key
  smtp_password:
    file: ./secrets/smtp_password

volumes:
  pg_data:
  redis_data:

# Переопределения для окружения «Разработка» (§10.1) поверх docker-compose.yml:
# PostgreSQL и Redis публикуются на хост только на петлевом интерфейсе — адрес литералом, а не
# переменной: открытость решала бы среда запуска, а страж `ports` видел бы лишь запись (роаст
# 001.25, раунд 6: стенд с 0.0.0.0 открывал Redis без пароля и базу машине разработчика и
# контейнерам соседних проектов VM). Тесты control-plane с другой машины ходят туннелем ssh
# (deploy/scripts/stand-tunnel.sh) по PG_DSN/REDIS_URL из conftest.py. Петлевой адрес закрывает их
# от сети мостов Docker и других машин, но не от процессов самой VM и контейнеров с сетью хоста:
# Redis стенда без пароля — остаточный риск стенда разработки (роаст 001.25, раунд 8). От соседей
# по сети (L2) петлевую публикацию закрывает Docker Engine с 28.0 (moby/moby#49325, #45610;
# стенд — 28.5.2): на более старом Docker соседняя машина достала бы порт маршрутом на адрес
# контейнера (роаст 001.25, раунд 9). Исходники
# приложения монтируются в контейнеры, api перезапускается при изменении файлов (APP_RELOAD;
# переменные UVICORN_* точка входа снимает — конфигурация uvicorn только в строке запуска).
#
# Переменные: PG_HOST_PORT, REDIS_HOST_PORT — см. .env.example.

services:
  postgres:
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  api:
    volumes:
      - ../../control-plane/app:/app/app:ro
      - ../../control-plane/migrations:/app/migrations:ro
    environment:
      APP_RELOAD: "1"

  worker-critical:
    volumes:
      - ../../control-plane/app:/app/app:ro

  worker-background:
    volumes:
      - ../../control-plane/app:/app/app:ro

  scheduler:
    volumes:
      - ../../control-plane/app:/app/app:ro

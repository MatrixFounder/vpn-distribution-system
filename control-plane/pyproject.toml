[project]
name = "control-plane"
version = "0.0.0"
description = "Control Plane распределённой VPN-инфраструктуры (Task 001)"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.36",
  "asyncpg>=0.31",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "jinja2>=3.1",
  "yoyo-migrations>=9",
  "cryptography>=46",
  "argon2-cffi>=25",
  "pyotp>=2.9",
  "redis>=6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.15,<0.16",
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert допустим только в тестах

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Единственная маска — она же в стороже `make test-py` (L-11: дефолт pytest
# включает ещё *_test.py, и сторож её не видел).
python_files = ["test_*.py"]

; Конфигурация CLI yoyo (control-plane/): источник миграций и подключение из переменной MIGRATE_DSN.
; Для CLI переменная должна содержать пароль и схему драйвера psycopg 3, например
;   MIGRATE_DSN=postgresql+psycopg://app_migrate:app@127.0.0.1:15432/control_plane
; Команда `python -m app.cli migrate` тем же файлам миграций не нуждается в этом ini: она принимает
; MIGRATE_DSN без пароля (как в Compose) и берёт пароль из MIGRATE_PASSWORD_FILE.
[DEFAULT]
sources = %(here)s/migrations
database = %(MIGRATE_DSN)s
batch_mode = on
verbosity = 1
